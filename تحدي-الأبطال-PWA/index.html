u062A\u062D\u0642 \u0647\u0630\u0647 \u0627\u0644\u062F\u0631\u062C\u0629 \u0639\u0646 \u062C\u062F\u0627\u0631\u0629\u060C \u0644\u0642\u062F \u0641\u0647\u0645\u062A \u0627\u0644\u062F\u0631\u0633 \u0648\u0637\u0628\u0642\u062A \u0628\u0628\u0631\u0627\u0639\u0629.","\u0643\u0633\u0628\u062A \u0627\u0644\u062A\u062D\u062F\u064A \u0627\u0644\u064A\u0648\u0645\u060C \u0648\u0641\u0648\u0632\u0643 \u0628\u0627\u0644\u062F\u0631\u062C\u0629 \u064A\u062B\u0628\u062A \u0645\u062A\u0627\u0628\u0639\u062A\u0643 \u0627\u0644\u0645\u0645\u062A\u0627\u0632\u0629 \u0644\u0644\u0634\u0631\u062D.","\u0625\u0636\u0627\u0641\u0629 \u0631\u0627\u0626\u0639\u0629 \u0644\u0631\u0635\u064A\u062F\u0643 \u0627\u0644\u062F\u0631\u0627\u0633\u064A\u060C \u0647\u0646\u064A\u0626\u0627\u064B \u0644\u0643 \u062F\u0631\u062C\u0629 \u062A\u062D\u062F\u064A \u0627\u0644\u064A\u0648\u0645.","\u0623\u062B\u0628\u062A\u0651\u064E \u0641\u0647\u0645\u0643 \u0627\u0644\u0633\u0631\u064A\u0639 \u0644\u0644\u062F\u0631\u0633\u060C \u0645\u0628\u0627\u0631\u0643 \u0644\u0643 \u0627\u0644\u0641\u0648\u0632 \u0628\u0627\u0644\u062A\u062D\u062F\u064A \u0628\u0646\u062C\u0627\u062D.","\u0627\u0646\u062A\u0628\u0627\u0647\u0643 \u0641\u064A \u0627\u0644\u062D\u0635\u0629 \u0643\u0627\u0646 \u0633\u0631 \u0641\u0648\u0632\u0643 \u0628\u0627\u0644\u062F\u0631\u062C\u0629 \u0627\u0644\u064A\u0648\u0645\u060C \u062A\u0627\u0628\u0639 \u062A\u0645\u064A\u0632\u0643.","\u0645\u0628\u0627\u0631\u0643 \u0644\u0643\u060C \u0647\u0630\u0647 \u0627\u0644\u062F\u0631\u062C\u0629 \u0647\u064A \u0623\u0648\u0644 \u063A\u064A\u062B \u0627\u0644\u062A\u0641\u0648\u0642 \u0641\u064A \u0627\u0644\u062F\u0631\u0648\u0633 \u0627\u0644\u0642\u0627\u062F\u0645\u0629.","\u062C\u0639\u0644\u062A \u0627\u0644\u062A\u062D\u062F\u064A \u064A\u0628\u062F\u0648 \u0633\u0647\u0644\u0627\u064B \u0628\u0641\u0636\u0644 \u0630\u0643\u0627\u0626\u0643 \u0648\u0633\u0631\u0639\u0629 \u0628\u062F\u064A\u0647\u062A\u0643\u060C \u0623\u062D\u0633\u0646\u062A.","\u062F\u0631\u062C\u0629 \u0645\u0633\u062A\u062D\u0642\u0629 \u062A\u0636\u0627\u0641 \u0644\u0633\u062C\u0644 \u0625\u0646\u062C\u0627\u0632\u0627\u062A\u0643 \u0627\u0644\u064A\u0648\u0645\u064A\u0629\u060C \u0647\u0646\u064A\u0626\u0627\u064B \u0644\u0643 \u0627\u0644\u062A\u0645\u064A\u0632.","\u0645\u0628\u0627\u0631\u0643 \u0644\u0643 \u062E\u0637\u0641 \u062F\u0631\u062C\u0629 \u0627\u0644\u062A\u062D\u062F\u064A\u060C \u0644\u0642\u062F \u0643\u0646\u062A \u0645\u0646\u062A\u0628\u0647\u0627\u064B \u0648\u0630\u0643\u064A\u0627\u064B \u0644\u0644\u063A\u0627\u064A\u0629.","\u0641\u0648\u0632\u0643 \u0641\u064A \u062A\u062D\u062F\u064A \u0627\u0644\u064A\u0648\u0645 \u064A\u0641\u062A\u062D \u0634\u0647\u064A\u062A\u0643 \u0644\u062F\u0631\u062C\u0627\u062A \u0627\u0644\u062A\u062D\u062F\u064A\u0627\u062A \u0627\u0644\u0642\u0627\u062F\u0645\u0629.","\u0639\u0647\u062F\u0646\u0627 \u0641\u064A\u0643 \u0627\u0644\u0630\u0643\u0627\u0621\u060C \u0648\u0627\u0644\u064A\u0648\u0645 \u0646\u0644\u062A \u062F\u0631\u062C\u0629 \u0627\u0644\u062A\u062D\u062F\u064A \u0628\u062C\u062F\u0627\u0631\u0629 \u0643\u0627\u0645\u0644\u0629.","\u0628\u0643\u0644 \u0641\u062E\u0631\u060C \u0646\u0628\u0627\u0631\u0643 \u0644\u0643 \u0643\u0633\u0628 \u0646\u0642\u0637\u0629 \u0627\u0644\u062A\u062D\u062F\u064A \u0628\u0639\u062F \u0647\u0630\u0627 \u0627\u0644\u062F\u0631\u0633 \u0627\u0644\u0645\u0645\u062A\u0639.","\u0623\u062D\u0633\u0646\u062A \u0635\u0646\u0639\u0627\u064B\u060C \u0627\u0644\u062F\u0631\u062C\u0629 \u0627\u0644\u064A\u0648\u0645 \u062A\u0644\u064A\u0642 \u0628\u062C\u0647\u062F\u0643 \u0648\u0627\u0646\u062A\u0628\u0627\u0647\u0643 \u0627\u0644\u0648\u0627\u0636\u062D \u0641\u064A \u0627\u0644\u0641\u0635\u0644.","\u0647\u0630\u0627 \u0627\u0644\u0625\u0646\u062C\u0627\u0632 \u0627\u0644\u0633\u0631\u064A\u0639 \u064A\u0639\u0643\u0633 \u062D\u062C\u0645 \u062A\u0631\u0643\u064A\u0632\u0643 \u0627\u0644\u0639\u0627\u0644\u064A \u0623\u <style>




html, body, #root { height: 100%; }

body {
  font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", "Noto Sans Arabic", sans-serif;
  color: var(--color-navy);
}

/* ====== مظاهر الواجهة (سمات) — تُبدَّل بخاصية data-theme على الجذر ====== */
[data-theme="boys"] {
  --color-sky: #DDF3FF;
  --color-teal: #19B8B0;
  --color-card: #FFFFFF;
  --color-gold: #E6B85C;
  --color-navy: #243B5A;
  --color-navy2: #4a6484;
  --color-bg: #F2FAFF;
  --color-good: #2FBF8F;
  --color-coral: #F26D6D;
}

[data-theme="girls"] {
  --color-sky: #FBD7EB;
  --color-teal: #C13AA1;
  --color-card: #FFF6FB;
  --color-gold: #E59BD6;
  --color-navy: #5A2450;
  --color-navy2: #7d4a70;       /* أغمق قليلًا من #8a5a7d: النصوص الثانوية صارت فوق حد القراءة المريحة (4.0 → 6.2) */
  --color-bg: #FFF0F8;
  --color-good: #C93B87;        /* وردي قرار (ليس أخضر) ووضوح عالٍ على الخلفية */
  --color-coral: #E0557F;
}

[data-theme="neutral"] {
  /* وضع ليلي داكن مريح: خلفيات داكنة ونصوص فاتحة عالية التباين */
  --color-sky: #1E2B33;
  --color-teal: #4DD0D8;
  --color-card: #16212B;
  --color-gold: #D4C15E;
  --color-navy: #E8EEF3;
  --color-navy2: #A7BAC6;
  --color-bg: #0D141A;
  --color-good: #4FC98E;
  --color-coral: #F27878;
}

/* تصحيحات الوضع الليلي (الظلال والحدود ونصوص الأزرار الملونة) في src/theme-dark.css */

/* الخلفيات العامة تتبع السمات عبر المتغيرات نفسها */
body { background: var(--color-bg); }

/* الخلفية المشرقة تتبع السمة: سماوي/تركوازي/ذهبي أو وردي/موف أو أخضر محايد */
.hero-bg {
  background:
    radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--color-teal) 16%, transparent), transparent 34%),
    radial-gradient(circle at 85% 12%, color-mix(in srgb, var(--color-gold) 18%, transparent), transparent 30%),
    radial-gradient(circle at 78% 82%, color-mix(in srgb, var(--color-teal) 12%, transparent), transparent 36%),
    radial-gradient(circle at 18% 78%, color-mix(in srgb, var(--color-gold) 12%, transparent), transparent 32%),
    linear-gradient(160deg, var(--color-sky) 0%, var(--color-bg) 45%, var(--color-card) 100%);
  background-color: var(--color-bg);
}

/* نجوم صغيرة متلألئة في الخلفية */
@keyframes twinkle {
  0%, 100% { opacity: .25; transform: scale(.85); }
  50% { opacity: .8; transform: scale(1.1); }
}
.bg-star {
  position: absolute;
  color: var(--color-gold);
  animation: twinkle 3.2s ease-in-out infinite;
  pointer-events: none;
  user-select: none;
}
.bg-star.teal { color: var(--color-teal); opacity: .4; }

.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

/* ظل ناعم للبطاقات */
.card-shadow {
  box-shadow: 0 4px 18px rgba(36, 59, 90, 0.08), 0 1px 4px rgba(36, 59, 90, 0.06);
}
.card-shadow-lg {
  box-shadow: 0 10px 34px rgba(36, 59, 90, 0.13), 0 2px 8px rgba(36, 59, 90, 0.07);
}

/* توهج زر السحب */
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 6px 22px color-mix(in srgb, var(--color-teal) 35%, transparent); }
  50% { box-shadow: 0 10px 42px color-mix(in srgb, var(--color-teal) 60%, transparent); }
}
.glow-pulse { animation: glowPulse 1.6s ease-in-out infinite; }

/* دخول العناصر */
@keyframes popIn {
  0% { transform: scale(.4); opacity: 0; }
  70% { transform: scale(1.08); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.pop-in { animation: popIn .55s cubic-bezier(.2,.9,.3,1.2) both; }

@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.float-y { animation: floatY 3s ease-in-out infinite; }

/* القصاصات الاحتفالية */
@keyframes confettiFall {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
.confetti-piece {
  position: absolute;
  top: -10vh;
  width: 10px;
  height: 16px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  pointer-events: none;
}

/* مؤشر السحب */
@keyframes tickerFlip {
  0% { transform: translateY(8px) scale(1.06); opacity: .25; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.ticker { animation: tickerFlip .08s linear; }

/* احترام تفضيل تقليل الحركة */
@media (prefers-reduced-motion: reduce) {
  .float-y, .glow-pulse, .bg-star, .ticker { animation: none !important; }
  .pop-in { animation-duration: .01s !important; }
  .confetti-piece { display: none; }
}

@media print {
  .no-print { display: none !important; }
  .hero-bg, body { background: white !important; }
  body, #root { color: #243B5A !important; }
}

/* تصحيحات الوضع الليلي (المظهر «neutral»)، ومتغيرات ألوانه في app.css.
   في هذا المظهر يصبح «الكحلي» لون النصوص الفاتح، وتصبح ألوان التمييز (التركواز والذهبي والأخضر والمرجاني) فاتحة،
   فتحتاج بعض العناصر تصحيحًا. القواعد هنا خارج طبقات Tailwind عمدًا، فتتقدم على أصنافه (مثل text-white و text-navy).
   المظهران الفاتحان (بنين وبنات) لا يتأثران بشيء من هذا الملف. */

/* ظلال وحدود أخف ضد الخلفية الداكنة */
[data-theme="neutral"] .card-shadow { box-shadow: 0 4px 18px rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.4); }
[data-theme="neutral"] .card-shadow-lg { box-shadow: 0 10px 34px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.45); }
[data-theme="neutral"] .border-navy\/12, [data-theme="neutral"] .border-navy\/10, [data-theme="neutral"] .border-navy\/15 { border-color: rgba(232,238,243,.18); }
[data-theme="neutral"] .bg-white\/85, [data-theme="neutral"] .bg-white\/90 { background-color: rgba(22,33,43,.9); }
[data-theme="neutral"] .bg-white { background-color: var(--color-card); }
[data-theme="neutral"] input, [data-theme="neutral"] select, [data-theme="neutral"] textarea { color: var(--color-navy); }
[data-theme="neutral"] input::placeholder, [data-theme="neutral"] textarea::placeholder { color: var(--color-navy2); }

/* الأزرار ذات الخلفية المصمتة بهذه الألوان: نصها وأيقوناتها بلون الخلفية الداكن.
   كان زر «وضع العرض على الشاشة الكبيرة» أبيض النص على خلفية شبه بيضاء فلا يُقرأ، وكانت الأزرار الذهبية
   («يالله نبدأ!»، «الطالب حاضر — ابدأ السؤال») والتركوازية («اختر الطالب») باهتة النص.
   النصوص المتدرجة (اسم الطالب وعنوان «الأبطال») ومربعات أيقونات الرئيسية ليست أزرارًا فلا تتأثر. */
[data-theme="neutral"] button:is(.bg-navy, .bg-teal, .bg-good, .bg-coral, .from-gold, .from-teal) {
  color: var(--color-bg);
}

/* لون التمرير الأصلي لزر «وضع العرض» كحلي داكن؛ هنا يبقى فاتحًا ليظل النص الداكن مقروءًا */
[data-theme="neutral"] button.bg-navy:hover { background-color: #cdd8e1; }

/* النص الذهبي الداكن الثابت (شارات «غائب» و«متوسط» و«تنبيه»، وزر «إنهاء المسابقة»، والتنبيهات) يصبح ذهبيًّا فاتحًا هنا.
   (كانت الشارات وحدها تفعل ذلك عبر وضع الجهاز الليلي، فتختفي تقريبًا في المظهرين الفاتحين على جهاز وضعه ليلي) */
[data-theme="neutral"] .text-\[\#b9892f\] { color: var(--color-gold); }

/* تصحيحات مظهر البنات («girls»)، ومتغيرات ألوانه في app.css.
   بعض ألوان المكوّنات مكتوبة بقيم ثابتة من المظهر الأزرق: نهاية التدرج الذهبي (#d9a63f خردلي)،
   ونهاية تدرج زر «اختر الطالب» (#128a84 تركوازي أخضر)، ونص الذهبي الداكن (#b9892f)، وألوان التمرير.
   فكانت تُدخل الخردلي والأخضر على لوحة وردية، وبعضها ضعيف القراءة على الخلفيات الوردية.
   هنا تُستبدل بدرجات من لوحة البنات نفسها. القواعد خارج طبقات Tailwind فتتقدم على أصنافه، ولا تمس المظهرين الآخرين. */

/* زر «اختر الطالب»: كان نصه البنفسجي الداكن على تدرج من الماجنتا إلى التركوازي (تباين 2.4) → نص أبيض على ماجنتا */
[data-theme="girls"] button.from-teal {
  --tw-gradient-to: #8E2479;
  color: #fff;
}

/* اسم الطالب في المسابقة وعنوان «الأبطال» وعنوان النتائج (نص متدرج):
   كان من الوردي الفاتح إلى الخردلي على خلفية وردية (تباين نحو 2) → وردي أعمق (3.4 إلى 5.6) */
[data-theme="girls"] .bg-clip-text.from-gold {
  --tw-gradient-from: #D2559F;
  --tw-gradient-to: #A6337F;
}

/* الأزرار الذهبية («يالله نبدأ!»، «بدء المسابقة»، «الطالب حاضر — ابدأ السؤال»…): تدرج وردي بدل نهاية الخردلي،
   ونصها البنفسجي الداكن يبقى مقروءًا (4.9 فأكثر). وعند التمرير وردي أفتح بدل الأصفر */
[data-theme="girls"] button.from-gold { --tw-gradient-to: #E08CC9; }
[data-theme="girls"] button.hover\:from-\[\#f0c46e\]:hover {
  --tw-gradient-from: #EDB3E0;
  --tw-gradient-to: #E59BD6;
}

/* النص الذهبي الداكن الثابت (شارات «غائب» و«متوسط» و«تنبيه» و«+1 درجة»، وزر «إنهاء المسابقة»، والتنبيهات):
   كان بنيًّا ذهبيًّا على وردي (تباين 2.3 إلى 3) → وردي داكن (5.5 فأكثر) */
[data-theme="girls"] .text-\[\#b9892f\] { color: #9B2C7C; }

/* ألوان التمرير الثابتة من المظهر الأزرق (تركوازي، أخضر، أحمر، كحلي) → درجات أغمق من ألوان هذا المظهر */
[data-theme="girls"] button.bg-teal:hover { background-color: #A62F8A; }
[data-theme="girls"] button.bg-good:hover { background-color: #AE2F72; }
[data-theme="girls"] button.bg-coral:hover { background-color: #C9456C; }
[data-theme="girls"] button.bg-navy:hover { background-color: #6E2D62; }

  position: absolute;
